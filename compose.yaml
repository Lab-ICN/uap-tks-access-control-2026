services:
  ctf:
    build: .
    ports:
      - "8080"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FINAL_FLAG: ${FINAL_FLAG:?Set FINAL_FLAG in .env}
      DB_PATH: /data/progress.sqlite3
    volumes:
      - progress:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  progress: